name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: &code_paths
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "version.txt"
      - "ci/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths: *code_paths

jobs:
  build-test:
    # Skip on release commits: the Release workflow builds+publishes those, and a release
    # bump is version-only (version.txt/Cargo.toml/Cargo.lock) — the code was already validated
    # by CI on the commit that introduced it, so re-running the full build+test is redundant.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release:') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, toolchain: stable-x86_64-pc-windows-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version drift guard
        shell: bash
        run: bash ci/check-version.sh

      - name: MinGW-w64 gcc (for rusb/libusb)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: false
      - name: Put MinGW on PATH
        shell: bash
        run: echo "$(cygpath -w /mingw64/bin)" >> "$GITHUB_PATH"

      - name: Install GNU Rust toolchain
        shell: bash
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}
          rustc -vV
          gcc --version

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test
        shell: bash
        run: cargo test

      - name: Build (release)
        shell: bash
        run: cargo build --release

      - name: Dry-run smoke (no hardware)
        shell: bash
        run: |
          set -o pipefail
          ./target/release/g13-driver.exe --check-config --config config.toml | tee check.txt
          ./target/release/g13-driver.exe --simulate "M1,G1,G2,G3,G4,BTN1,BTN2,M2,G1" --config config.toml | tee sim.txt
          grep -qx '\[check\] ok: 3 profiles, 0 errors' check.txt
          grep -q '^\[dry-run\] M1 -> profile "V1 build"$' sim.txt
          grep -q '^\[dry-run\] G1 -> paste_text file=prompts/v1-build/01-spec-pr.md method=clipboard restore_clipboard=true chars=[0-9]\+$' sim.txt
          grep -q '^\[dry-run\] G2 -> paste_text file=prompts/v1-build/02-grill-me.md ' sim.txt
          grep -q '^\[dry-run\] BTN2 -> launch_or_focus process=Cursor.exe ' sim.txt
          grep -q '^\[dry-run\] G1 -> paste_text file=prompts/workflow-2/01-step.md ' sim.txt
          grep -q '^\[dry-run\] done: 9 events, 0 errors$' sim.txt
          ! grep -qi 'paste your' sim.txt
